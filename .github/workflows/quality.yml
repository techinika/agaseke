name: Quality

on:
  push:
    branches: ["main", "feat/**", "fix/**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint new UI code
        run: npm run lint:ci

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm run test

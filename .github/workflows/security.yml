name: Security

on:
  push:
    branches: [dev, main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # gitleaks-action requires a paid license for organization repos; the
      # CLI is free, so install a pinned release and verify its checksum.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          FILE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL "${BASE}/${FILE}" -o "/tmp/${FILE}"
          curl -sSfL "${BASE}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o /tmp/gitleaks_checksums.txt
          (cd /tmp && grep -F "${FILE}" gitleaks_checksums.txt | sha256sum -c -)
          sudo tar -xzf "/tmp/${FILE}" -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan for secrets
        run: gitleaks git --redact --verbose --no-banner

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
        continue-on-error: true
